; Runs the FastAPI backend and the Next.js frontend side by side in the
; "learnhouse" image. Each program restarts on its own if it crashes.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=uvicorn app:app --host 127.0.0.1 --port %(ENV_LEARNHOUSE_PORT)s --timeout-keep-alive 600 --proxy-headers --forwarded-allow-ips=*
directory=/app/api
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
; Wait for the API so the first page render can resolve the org.
command=sh -c 'until curl -fsS -o /dev/null http://127.0.0.1:%(ENV_LEARNHOUSE_PORT)s/api/v1/health; do sleep 1; done; exec node server-wrapper.js'
directory=/app/web/apps/web
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
