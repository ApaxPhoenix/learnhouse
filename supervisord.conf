[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0


[program:backend]
command=uv run uvicorn app:app --host 0.0.0.0 --port 9000 --timeout-keep-alive 600
directory=/app/apps/api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=node server-wrapper.js
directory=/app/apps/web
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0