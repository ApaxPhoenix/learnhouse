[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0


[program:backend]
command=uv run uvicorn app:app --host 0.0.0.0 --port 9000 --timeout-keep-alive 600
directory=/app/apps/api
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=bash -c "while ! curl -s -o /dev/null -w '%%{http_code}' http://127.0.0.1:9000/api/v1/health | grep -q '200'; do sleep 1; done && node apps/web/server-wrapper.js"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0