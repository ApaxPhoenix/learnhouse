[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0


[program:backend]
command=uv run uvicorn app:app --host 0.0.0.0 --port 9000 --timeout-keep-alive 600
directory=/app/apps/api
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=bash -c "while ! nc -z 127.0.0.1 9000; do sleep 1; done && node apps/web/server.js"
directory=/app/apps/web
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0